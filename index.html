<title>Сотки</title>
<meta name="description" content="Прототип игры в фишки с серверной детерминированной физикой и проверяемо честными бросками">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=cyrillic">
<style>
  /* Единый «пластиковый» мир: чёрные биты, красная бита, бирюзовая проверка. Один тёмный вид для обеих тем. */
  :root {
    color-scheme: dark;
    --ink: #f3ede2;
    --ink-2: #b9b1a4;
    --ink-3: #7d766c;
    --plastic: #19181c;
    --plastic-2: #242328;
    --plastic-3: #302e35;
    --edge: #3b3941;
    --red: #ff4b3a;
    --red-deep: #c42e20;
    --ok: #3fd6a4;
    --warn: #ffb52e;
    --bad: #ff5d6c;
    --display: 'Rubik Mono One', 'Arial Black', system-ui, sans-serif;
    --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #120f0c;
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app { position: relative; height: 100%; }
  #gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---------- HUD сверху ---------- */
  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 10px 16px 0;
    display: grid; gap: 8px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .players { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
  .plaque {
    background: color-mix(in srgb, var(--plastic) 88%, transparent);
    border: 1px solid var(--edge);
    border-radius: 12px;
    padding: 8px 10px;
    display: grid; gap: 2px;
    min-width: 0;
    transition: border-color .2s, box-shadow .2s;
  }
  .plaque.right { text-align: right; }
  .plaque.active { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 6px 24px -8px var(--red); }
  .plaque .name { font-family: var(--display); font-size: 12px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plaque .nums { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .plaque .nums b { color: var(--ink); font-weight: 700; }
  .turnbox {
    display: grid; place-content: center; text-align: center; gap: 2px;
    padding: 0 6px;
  }
  .turnbox .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .turnbox .val { font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .chipbtn {
    background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center;
  }
  .chipbtn:hover { background: var(--plastic-3); }
  .chipbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .chipbtn .dot.ok { background: var(--ok); } .chipbtn .dot.bad { background: var(--bad); } .chipbtn .dot.wait { background: var(--warn); }
  .chipbtn.ghost { background: transparent; }

  .status {
    justify-self: center;
    font-size: 12px; color: var(--ink-2);
    background: color-mix(in srgb, var(--plastic) 70%, transparent);
    border-radius: 999px; padding: 4px 12px;
    max-width: 100%; text-align: center;
  }

  /* ---------- Пульт снизу ---------- */
  .deck {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(18,15,12,.96) 60%, rgba(18,15,12,0));
    display: grid; gap: 10px; justify-items: center;
    pointer-events: none;
  }
  .deck > * { pointer-events: auto; }
  .deck.locked .ctrl { opacity: .45; pointer-events: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; width: min(360px, 100%); background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; border-radius: 7px; padding: 8px 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--plastic); }
  .mode-badge { font-family: var(--display); font-size: 12px; letter-spacing: .04em; color: var(--ink); background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modes button { display: grid; gap: 6px; text-align: left; align-content: start; background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 12px; padding: 14px 12px; }
  .modes button:hover { border-color: var(--red); }
  .modes b { font-family: var(--display); font-weight: 400; font-size: 14px; }
  .modes span { font-size: 12px; line-height: 1.4; color: var(--ink-2); }
  @media (max-width: 380px) { .modes { grid-template-columns: 1fr; } }
  .hint { margin: 0; max-width: 46ch; text-align: center; font-size: 12px; line-height: 1.45; color: var(--ink-2); text-wrap: balance; }
  .hint b { color: var(--ink); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 11px; color: var(--ink-3); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .sw.ok { background: var(--ok); } .sw.warn { background: var(--warn); } .sw.bad { background: var(--bad); }
  .z.ok { color: var(--ok); } .z.warn { color: var(--warn); } .z.bad { color: var(--bad); }

  /* Кольцо «хватай здесь» */
  .grabring {
    position: absolute; transform: translate(-50%, -50%); border-radius: 50%;
    border: 2px dashed rgba(255, 75, 58, .75); pointer-events: none; z-index: 2;
    animation: ring 1.6s ease-in-out infinite;
  }
  @keyframes ring { 50% { transform: translate(-50%, -50%) scale(1.08); border-color: rgba(255, 75, 58, .35); } }

  /* Показания во время жеста */
  .readout {
    position: fixed; transform: translate(-50%, -100%); z-index: 12; pointer-events: none;
    background: var(--plastic); border: 1px solid var(--edge); border-radius: 12px;
    padding: 8px 12px; display: grid; gap: 4px; min-width: 170px; text-align: center;
    font-size: 12px; font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .readout #ro-p { font-family: var(--display); font-size: 13px; }
  .ro-track { display: block; height: 6px; border-radius: 3px; background: var(--plastic-3); overflow: hidden; }
  .ro-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb52e, var(--red)); }

  /* ---------- Листы ---------- */
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; align-items: end; justify-items: center; z-index: 10; }
  .sheet {
    width: min(560px, 100%);
    max-height: 82%;
    overflow-y: auto;
    background: var(--plastic);
    border: 1px solid var(--edge); border-bottom: 0;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 14px;
    user-select: text;
  }
  .sheet h2 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 400; text-wrap: balance; }
  .sheet h3 { margin: 4px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .sheet p { margin: 0; color: var(--ink-2); line-height: 1.5; max-width: 62ch; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .x { background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; line-height: 1; flex: none; }

  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 12px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; font-family: var(--mono); word-break: break-all; color: var(--ink); }
  .checks { display: grid; gap: 6px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
  .check .ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--plastic); background: var(--ink-3); }
  .check.ok .ic { background: var(--ok); } .check.bad .ic { background: var(--bad); } .check.wait .ic { background: var(--warn); }
  .steps { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); line-height: 1.45; }

  .bits { display: grid; gap: 10px; }
  .bit {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; text-align: left;
  }
  .bit[aria-pressed="true"] { border-color: var(--red); }
  .bit canvas { width: 56px; height: 56px; }
  .bit .nm { font-weight: 700; }
  .bit .ds { font-size: 12px; color: var(--ink-2); }
  .bars { display: grid; grid-template-columns: max-content 1fr; gap: 3px 8px; font-size: 11px; color: var(--ink-3); margin-top: 6px; align-items: center; }
  .bar { height: 5px; border-radius: 3px; background: var(--plastic-3); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink-2); }
  .bit > span { min-width: 0; }
  .price { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: right; line-height: 1.4; }

  .coll-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .coll-head b { font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .cell { display: grid; gap: 3px; justify-items: center; text-align: center; font-size: 10px; color: var(--ink-2); }
  .cell img { width: 56px; height: 56px; border-radius: 50%; }
  .cell .new { color: var(--ok); font-weight: 700; }

  /* ---------- Оверлеи ---------- */
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,8,6,.62); z-index: 9; padding-inline: 16px; }
  .card {
    width: min(420px, 100%);
    background: var(--plastic); border: 1px solid var(--edge); border-radius: 18px;
    padding: 22px 18px; display: grid; gap: 14px; text-align: center;
  }
  .card h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 400; text-wrap: balance; }
  .card p { margin: 0; color: var(--ink-2); line-height: 1.5; }
  .rps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rps button { background: var(--plastic-2); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 4px; display: grid; gap: 4px; font-size: 12px; }
  .rps button span { font-size: 28px; }
  .rps button:hover { border-color: var(--red); }
  .big { background: var(--red); border: 0; border-radius: 12px; padding: 12px 16px; font-family: var(--display); font-size: 13px; color: #fff; }
  .card p.small { font-size: 12px; color: var(--ink-3); }
  .big.ghost { background: transparent; border: 1px solid var(--edge); color: var(--ink); }
  .turn-timer {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 50%; transform: translateX(-50%);
    background: var(--plastic); border: 1px solid var(--edge); border-radius: 999px;
    padding: 4px 12px; font-family: var(--display); font-size: 13px; z-index: 7; pointer-events: none;
  }
  .turn-timer.hot { border-color: var(--red); color: var(--red); }

  .toast {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    background: var(--plastic); border: 1px solid var(--edge); border-radius: 14px;
    padding: 12px 18px; text-align: center; z-index: 8; pointer-events: none;
    display: grid; gap: 4px; max-width: calc(100% - 32px);
    animation: pop .25s ease-out;
  }
  .toast .t1 { font-family: var(--display); font-size: 16px; }
  .toast .t2 { font-size: 12px; color: var(--ink-2); }
  @keyframes pop { from { transform: translate(-50%, -40%) scale(.9); opacity: 0; } }
  .skip { position: absolute; right: 16px; bottom: calc(130px + env(safe-area-inset-bottom, 0px)); z-index: 7; }

  .boot { position: absolute; inset: 0; display: grid; place-items: center; z-index: 20; background: #120f0c; }
  .boot div { font-family: var(--display); font-size: 14px; color: var(--ink-2); }

  @media (max-width: 420px) {
    .turnbox .val { font-size: 15px; }
    .legend { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast, .grabring { animation: none; } }
</style>

<div id="app">
  <canvas id="gl" aria-label="Игровой стол"></canvas>

  <div class="hud">
    <div class="players">
      <div class="plaque" id="p0"></div>
      <div class="turnbox"><span class="lbl">Ход</span><span class="val" id="turnno">—</span></div>
      <div class="plaque right" id="p1"></div>
    </div>
    <div class="tools">
      <button class="chipbtn" id="btn-fair"><span class="dot" id="fairdot"></span>Честность броска</button>
      <button class="chipbtn" id="btn-bits">Бита</button>
      <button class="chipbtn" id="btn-coll">Коллекции</button>
      <button class="chipbtn ghost" id="btn-cam">Камера</button>
      <button class="chipbtn ghost" id="btn-sound" aria-pressed="true">Звук: вкл</button>
      <button class="chipbtn ghost" id="btn-slow" aria-pressed="false">Slow ×0.25</button>
    </div>
    <div class="status" id="status">Загрузка физики…</div>
  </div>

  <div class="grabring" id="grabring" hidden aria-hidden="true"></div>
  <div class="readout" id="readout" hidden>
    <span class="ro-track"><i id="ro-bar"></i></span>
    <span id="ro-p">Тяните вверх</span>
    <span id="ro-t" class="z ok">Наклон 0.0° · засчитывается</span>
  </div>

  <div class="deck locked" id="deck">
    <div class="mode-badge" id="mode-badge">Способ ещё не выбран</div>
    <p class="hint" id="hint"></p>
    <div class="legend" aria-hidden="true">
      <span><i class="sw ok"></i>до 20° засчитывается</span>
      <span><i class="sw warn"></i>20–30° предупреждение</span>
      <span><i class="sw bad"></i>больше 30° фол</span>
    </div>
  </div>

  <div class="boot" id="boot"><div>СОТКИ · загрузка физики…</div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./client/app.js"></script>
